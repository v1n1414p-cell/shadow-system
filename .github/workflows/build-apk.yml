name: APK SHADOW SYSTEM

on:
  workflow_dispatch:

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Descompactar projeto Android
        run: |
          rm -rf SHADOW_BUILD
          mkdir SHADOW_BUILD
          unzip -q SHADOW_SYSTEM_ANDROID.zip -d SHADOW_BUILD

      - name: Encontrar projeto
        run: |
          find SHADOW_BUILD -maxdepth 3 -type f | head -100

      - name: Compilar APK
        working-directory: SHADOW_BUILD/SHADOW_SYSTEM_ANDROID
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-SYSTEM-APK
          path: SHADOW_BUILD/SHADOW_SYSTEM_ANDROID/app/build/outputs/apk/debug/app-debug.apk
